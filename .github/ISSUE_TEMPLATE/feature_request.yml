name: Feature request
description: Propose a new preset, export format, or workflow improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow this unlocks. Prefer scoped ideas that stay local-first (no required upload / account).
  - type: textarea
    id: problem
    attributes:
      label: Problem / job to be done
      description: What are you trying to finish when you reach for Icon Sizes?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Preset sizes, export layout, UI change, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other tools, manual steps, or workarounds.
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this if maintainers agree on scope
